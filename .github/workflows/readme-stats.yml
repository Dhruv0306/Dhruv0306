name: Update README Cards

on:
  schedule:
    # Automatically updates every 6 hours
    - cron: '0 */6 * * *'
  # Allows you to manually run the workflow from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Create the asset folder so the workflow doesn't fail on missing directories
      - name: Create assets directory
        run: mkdir -p profile-assets

      # Card 1: Overview Stats
      - name: Generate Github Readme Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          card: stats
          options: username=Dhruv0306&theme=radical&show_icons=true&hide_border=true&count_private=true
          path: profile-assets/stats.svg

      # Card 2: Top Languages
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          card: top-langs
          options: username=Dhruv0306&theme=radical&layout=compact&hide_border=true&exclude_repo=air-quality-monitoring-esp32
          path: profile-assets/top-langs.svg

      # Card 3: Streak Stats (Fixed version tag & arguments layout)
      - name: Generate Streak Stats Card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Dhruv0306&theme=radical&hide_border=true
          path: profile-assets/streak.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Commit and push changes back to your profile repo
      - name: Commit and Push Generated Cards
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile-assets/*.svg
          git diff-index --quiet HEAD || git commit -m "Update profile stats cards [skip ci]"
          git push
