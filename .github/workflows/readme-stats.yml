name: Update README Cards

on:
  schedule:
    # Automatically updates every 12 hours
    - cron: '0 */12 * * *'
  # Allows you to manually run the workflow from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Github Readme Stats Cards
        uses: vn7n24fzkq/github-readme-stats-action@v1.0.0
        with:
          # Your Classic Personal Access Token saved in Repository Secrets
          token: ${{ secrets.PAT_TOKEN }}
          
          # Card 1: Overview Stats configuration
          stats_username: "Dhruv0306"
          stats_theme: "radical"
          stats_show_icons: "true"
          stats_hide_border: "true"
          stats_count_private: "true"
          stats_output: "profile-assets/stats.svg"

          # Card 2: Top Languages configuration
          langs_username: "Dhruv0306"
          langs_theme: "radical"
          langs_layout: "compact"
          langs_hide_border: "true"
          langs_output: "profile-assets/top-langs.svg"

          # Card 3: Streak Stats configuration
          streak_username: "Dhruv0306"
          streak_theme: "radical"
          streak_hide_border: "true"
          streak_output: "profile-assets/streak.svg"

      - name: Commit and Push Generated Cards
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile-assets/*.svg
          # Only commit if changes actually exist to avoid empty commit errors
          git diff-index --quiet HEAD || git commit -m "Update profile stats cards [skip ci]"
          git push
